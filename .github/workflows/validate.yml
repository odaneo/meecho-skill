name: Validate Meecho

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: 运行静态契约检查
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 检查 Meecho 静态契约
        shell: pwsh
        run: ./tools/dev/meecho-dev.ps1 validate
