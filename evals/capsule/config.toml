history.persistence = "none"
web_search = "disabled"
default_permissions = "meecho-capsule-deny"
cli_auth_credentials_store = "file"
allow_login_shell = false
model_reasoning_effort = "high"
personality = "none"

[features]
apps = false
goals = false
hooks = false
memories = false
multi_agent = false
remote_plugin = false
shell_snapshot = false
skill_mcp_dependency_install = false

[shell_environment_policy]
inherit = "core"
include_only = [
  "SystemRoot", "WINDIR", "COMSPEC", "PATHEXT", "PATH",
  "TEMP", "TMP", "LOCALAPPDATA", "APPDATA",
  "ProgramData", "ProgramFiles", "ProgramFiles(x86)",
  "CommonProgramFiles", "CommonProgramFiles(x86)",
  "USERNAME", "USERDOMAIN", "USERPROFILE", "HOME",
  "CODEX_HOME", "CODEX_SQLITE_HOME"
]

[permissions.meecho-capsule-deny.filesystem]
":minimal" = "read"
"~" = "deny"
"~/.meecho" = "read"

[permissions.meecho-capsule-deny.filesystem.":workspace_roots"]
"." = "write"

[permissions.meecho-capsule-read.filesystem]
":minimal" = "read"
"~" = "deny"
"~/.meecho" = "read"

[permissions.meecho-capsule-read.filesystem.":workspace_roots"]
"." = "write"

[permissions.meecho-capsule-allow.filesystem]
":minimal" = "read"

[permissions.meecho-capsule-allow.filesystem.":workspace_roots"]
"." = "write"
